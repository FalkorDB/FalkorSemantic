name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: falkordb/falkorsemantic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=edge,branch=main
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke test (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # Start container using the image loaded by buildx
          IMAGE_TAG=$(echo '${{ steps.meta.outputs.tags }}' | head -n1)
          docker run -d --rm --name smoke-test -p 6379:6379 "$IMAGE_TAG"
          trap 'docker stop smoke-test 2>/dev/null || true' EXIT

          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if docker exec smoke-test redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

          # Verify both modules are loaded
          MODULES=$(docker exec smoke-test redis-cli MODULE LIST)
          echo "Loaded modules:"
          echo "$MODULES"

          echo "$MODULES" | grep -qi "graph" || { echo "FAIL: FalkorDB module not loaded"; exit 1; }
          echo "$MODULES" | grep -qi "semantic" || { echo "FAIL: FalkorSemantic module not loaded"; exit 1; }

          # Verify RDF commands exist
          docker exec smoke-test redis-cli COMMAND INFO rdf.insert | grep -q "rdf.insert" || { echo "FAIL: rdf.insert command not found"; exit 1; }

          echo "Smoke test passed!"
