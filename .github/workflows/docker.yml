name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke test (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # Load the image built by buildx
          docker build -t falkorsemantic:test .

          # Start container
          docker run -d --rm --name smoke-test -p 6379:6379 falkorsemantic:test
          trap 'docker stop smoke-test 2>/dev/null || true' EXIT

          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if docker exec smoke-test redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

          # Verify both modules are loaded
          MODULES=$(docker exec smoke-test redis-cli MODULE LIST)
          echo "Loaded modules:"
          echo "$MODULES"

          echo "$MODULES" | grep -qi "graph" || { echo "FAIL: FalkorDB module not loaded"; exit 1; }
          echo "$MODULES" | grep -qi "semantic" || { echo "FAIL: FalkorSemantic module not loaded"; exit 1; }

          # Verify RDF commands exist
          docker exec smoke-test redis-cli COMMAND INFO rdf.insert | grep -q "rdf.insert" || { echo "FAIL: rdf.insert command not found"; exit 1; }

          echo "Smoke test passed!"
