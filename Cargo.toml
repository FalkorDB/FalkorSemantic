[workspace]
members = [
    "parser",
    "mapper",
    "storage",
    "module",
    "tests-e2e",
    "tests-compliance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FalkorDB Team"]
license = "AGPL-3.0"
repository = "https://github.com/FalkorDB/FalkorSemantic"
rust-version = "1.75"

[workspace.dependencies]
# Redis module development
redis-module = "2.0"

# Redis client for testing
redis = "1.1"

# Async runtime
tokio = { version = "1.50", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Testing
mockall = "0.14"

# JSON-LD
json-ld = "0.21"
rdf-types = "0.22"
locspan = "0.9"
iref = "3.2"
static-iref = "3.0"
contextual = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
