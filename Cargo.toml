[workspace]
members = [
    "parser",
    "mapper",
    "module",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FalkorDB Team"]
license = "MIT"
repository = "https://github.com/FalkorDB/FalkorSemantic"
rust-version = "1.75"

[workspace.dependencies]
# Redis module development
redis-module = "2.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Testing
mockall = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
