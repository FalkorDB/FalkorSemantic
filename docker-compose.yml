version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: falkorsemantic-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./target/release:/usr/lib/redis/modules
    command: >
      redis-server
      --loadmodule /usr/lib/redis/modules/libfalkorsemantic_module.so
      --save 60 1
      --loglevel notice
    networks:
      - falkorsemantic-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkorsemantic-falkordb
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data
    networks:
      - falkorsemantic-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # All-in-one FalkorSemantic container (FalkorDB + RDF/SPARQL)
  falkorsemantic:
    image: ghcr.io/falkordb/falkorsemantic:latest
    # Or for local build:
    # build: .
    container_name: falkorsemantic-server
    ports:
      - "6381:6379"
    volumes:
      - falkorsemantic_data:/var/lib/falkordb/data
    networks:
      - falkorsemantic-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Development container with all tools
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: falkorsemantic-dev
    volumes:
      - .:/workspace
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/workspace/target
    working_dir: /workspace
    command: sleep infinity
    networks:
      - falkorsemantic-net
    depends_on:
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy

volumes:
  redis_data:
  falkordb_data:
  falkorsemantic_data:
  cargo_cache:
  target_cache:

networks:
  falkorsemantic-net:
    driver: bridge
